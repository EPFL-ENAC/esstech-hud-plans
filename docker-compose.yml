services:
  postgres:
    image: postgres:17.10-alpine
    expose:
      - 5432
    ports:
      - '5432:5432'
    environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_HOST=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/data

  prefect:
    image: prefecthq/prefect:3-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PREFECT_SERVER_DATABASE_CONNECTION_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_UI_API_URL=http://localhost:4200/api
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_LOGS_STREAM_OUT_ENABLED=true
      - PREFECT_SERVER_LOGS_STREAM_PUBLISHING_ENABLED=true
    command: prefect server start
    ports:
      - '4200:4200'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  tusd:
    image: tusproject/tusd:v2.10.1
    # The image runs USER tusd; on dev machines where bind mounts appear
    # root-owned inside containers, tusd must run as root to write the mount
    user: "0:0"
    # Loopback publishing keeps tusd private in dev. The backend proxies the
    # upload requests, so the real deployment publishes no tusd port and the
    # backend reaches tusd at TUSD_INTERNAL_URL=http://tusd:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ${TUSD_UPLOAD_DIR:-/tmp/hud-tusd-uploads}:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - -upload-dir
      - /data
      - -port
      - '8080'
      - -hooks-http
      - ${TUSD_HOOKS_HTTP_URL:-http://host.docker.internal:8000/api/tus/hooks}
      - -hooks-enabled-events
      - pre-create
      - -disable-download

volumes:
  postgres:
    driver: local
