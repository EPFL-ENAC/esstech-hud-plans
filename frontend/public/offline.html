<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#00a79f" />
        <title>HUD Plans — Offline</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
                    max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
                font:
                    1rem/1.6 system-ui,
                    sans-serif;
                background: #f5faf9;
                color: #1c1c1e;
            }
            main {
                max-width: 440px;
            }
            .brand {
                color: #007c76;
                font-weight: 650;
            }
            h1 {
                font-size: 2rem;
                line-height: 1.2;
            }
            button {
                border: 0;
                border-radius: 8px;
                padding: 12px 24px;
                font: inherit;
                background: #007c76;
                color: white;
                cursor: pointer;
            }
            button:focus-visible {
                outline: 3px solid #1c1c1e;
                outline-offset: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="brand">EssTech HUD Plans</p>
            <h1 id="heading">You’re offline</h1>
            <p id="message">
                Connect to the internet to sign in, capture videos, and view your buildings and
                plans.
            </p>
            <button id="retry" type="button">Try again</button>
        </main>
        <script>
            const messages = {
                en: {
                    heading: 'You’re offline',
                    message:
                        'Connect to the internet to sign in, capture videos, and view your buildings and plans.',
                    retry: 'Try again',
                },
                fr: {
                    heading: 'Vous êtes hors ligne',
                    message:
                        'Connectez-vous à Internet pour vous identifier, filmer et consulter vos bâtiments et plans.',
                    retry: 'Réessayer',
                },
                es: {
                    heading: 'Sin conexión',
                    message:
                        'Conéctate a Internet para iniciar sesión, grabar vídeos y consultar tus edificios y planos.',
                    retry: 'Reintentar',
                },
            };
            let language = navigator.language.slice(0, 2);
            try {
                language = localStorage.getItem('hud-language') || language;
            } catch {
                /* Storage is optional. */
            }
            if (!Object.hasOwn(messages, language)) language = 'en';
            document.documentElement.lang = language;
            const translated = messages[language];
            document.title = 'HUD Plans — ' + translated.heading;
            for (const id of ['heading', 'message', 'retry']) {
                document.getElementById(id).textContent = translated[id];
            }
            document.getElementById('retry').addEventListener('click', () => {
                // A fallback keeps the requested URL and hash, so reload resumes that route.
                // Also support visiting offline.html directly from the public directory.
                if (location.pathname === '/offline.html') location.replace('/');
                else location.reload();
            });
        </script>
    </body>
</html>
